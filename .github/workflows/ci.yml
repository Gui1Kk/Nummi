name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: https://uqisolhdsvzjmdvohbki.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jAg9zWHKrkK3X2FRXdhgFw_5-r48ScB
  VITE_API_URL: https://uqisolhdsvzjmdvohbki.supabase.co/functions/v1/api-v1/v1

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > tsc-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish typecheck diagnostics
        if: steps.typecheck.outputs.status != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('tsc-output.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## TypeScript diagnostics\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - name: Enforce typecheck
        if: steps.typecheck.outputs.status != '0'
        run: cat tsc-output.txt && exit 1
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npx vite build
      - run: npm run check:bundle
      - run: npm run test:api-public

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
