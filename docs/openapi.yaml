openapi: 3.1.0
info:
  title: Nummi API
  version: 1.2.1
  description: API financeira pessoal. Toda rota exige um JWT Supabase e todas as linhas são isoladas por RLS.
servers:
  - url: https://uqisolhdsvzjmdvohbki.supabase.co/functions/v1/api-v1/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Estado autenticado da API
      responses:
        '200': { description: API ativa }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /snapshot:
    get:
      summary: Snapshot limitado para a interface
      responses:
        '200': { description: Dados financeiros do usuário }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /profile:
    get:
      summary: Consultar perfil
      responses: { '200': { description: Perfil } }
    patch:
      summary: Alterar perfil
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200': { description: Perfil atualizado }
        '400': { $ref: '#/components/responses/ValidationError' }
  /settings:
    get:
      summary: Consultar preferências
      responses: { '200': { description: Preferências } }
    patch:
      summary: Alterar preferências
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses: { '200': { description: Preferências atualizadas } }
  /transactions:
    get:
      summary: Listar lançamentos
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - { in: query, name: kind, schema: { type: string, enum: [income, expense] } }
        - { in: query, name: status, schema: { type: string, enum: [planned, posted] } }
        - { in: query, name: category_id, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses: { '200': { description: Página de lançamentos } }
    post:
      summary: Criar lançamento
      parameters:
        - { in: header, name: Idempotency-Key, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201': { description: Criado }
        '200': { description: Replay idempotente }
        '400': { $ref: '#/components/responses/ValidationError' }
  /transactions/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      summary: Consultar lançamento
      responses:
        '200': { description: Lançamento }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Alterar lançamento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionPatch' }
      responses:
        '200': { description: Atualizado }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Excluir lançamento
      responses:
        '204': { description: Excluído }
        '404': { $ref: '#/components/responses/NotFound' }
  /categories:
    get:
      summary: Listar categorias
      responses: { '200': { description: Categorias } }
    post:
      summary: Criar categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses: { '201': { description: Criada } }
  /categories/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      summary: Consultar categoria
      responses: { '200': { description: Categoria } }
    patch:
      summary: Alterar categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses: { '200': { description: Atualizada } }
    delete:
      summary: Excluir categoria não utilizada
      responses:
        '204': { description: Excluída }
        '409': { description: Categoria em uso }
  /recurrences:
    get:
      summary: Listar recorrências
      responses: { '200': { description: Recorrências } }
    post:
      summary: Criar recorrência
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurrenceInput' }
      responses: { '201': { description: Criada } }
  /recurrences/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      summary: Consultar recorrência
      responses: { '200': { description: Recorrência } }
    patch:
      summary: Alterar ou pausar recorrência
      responses: { '200': { description: Atualizada } }
    delete:
      summary: Excluir recorrência
      responses: { '204': { description: Excluída } }
  /subscriptions:
    get:
      summary: Listar assinaturas
      responses: { '200': { description: Assinaturas } }
    post:
      summary: Criar assinatura
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses: { '201': { description: Criada } }
  /subscriptions/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      summary: Consultar assinatura
      responses: { '200': { description: Assinatura } }
    patch:
      summary: Alterar ou pausar assinatura
      responses: { '200': { description: Atualizada } }
    delete:
      summary: Excluir assinatura
      responses: { '204': { description: Excluída } }
  /budgets:
    get:
      summary: Listar orçamentos
      responses: { '200': { description: Orçamentos } }
    post:
      summary: Criar ou substituir orçamento mensal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetInput' }
      responses: { '201': { description: Salvo } }
  /budgets/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    patch:
      summary: Alterar orçamento
      responses: { '200': { description: Atualizado } }
    delete:
      summary: Excluir orçamento
      responses: { '204': { description: Excluído } }
  /summary:
    get:
      summary: Resumo por intervalo
      description: O intervalo máximo é de dez anos e o resultado não pode exceder 10.000 lançamentos.
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Entradas, saídas, saldo e valores previstos }
        '413': { $ref: '#/components/responses/ResultSetTooLarge' }
  /automations/post-due:
    post:
      summary: Gerar ocorrências vencidas de forma idempotente
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                through: { type: string, format: date }
                max_occurrences: { type: integer, minimum: 1, maximum: 500 }
      responses: { '200': { description: Contadores da execução } }
  /export/transactions:
    get:
      summary: Exportar até 10.000 lançamentos
      parameters:
        - { in: query, name: format, required: true, schema: { type: string, enum: [json, csv] } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses: { '200': { description: Arquivo ou JSON } }
  /import/transactions:
    post:
      summary: Importar até 500 lançamentos idempotentes
      responses: { '200': { description: Quantidade aceita, inserida e duplicada } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    Limit: { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    Offset: { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
  schemas:
    TransactionInput:
      type: object
      additionalProperties: false
      required: [description, amount, kind, transaction_date]
      properties:
        description: { type: string, minLength: 1, maxLength: 160 }
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999999.99 }
        kind: { type: string, enum: [income, expense] }
        status: { type: string, enum: [planned, posted], default: posted }
        category_id: { type: [string, 'null'], format: uuid }
        transaction_date: { type: string, format: date }
        note: { type: [string, 'null'], maxLength: 2000 }
        idempotency_key: { type: string, minLength: 8, maxLength: 128 }
    TransactionPatch:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, minLength: 1, maxLength: 160 }
        amount: { type: number, exclusiveMinimum: 0, maximum: 999999999999.99 }
        kind: { type: string, enum: [income, expense] }
        status: { type: string, enum: [planned, posted] }
        category_id: { type: [string, 'null'], format: uuid }
        transaction_date: { type: string, format: date }
        note: { type: [string, 'null'], maxLength: 2000 }
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        scope: { type: string, enum: [income, expense, both] }
        color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        archived: { type: boolean }
    RecurrenceInput: { type: object, additionalProperties: false }
    SubscriptionInput: { type: object, additionalProperties: false }
    BudgetInput: { type: object, additionalProperties: false }
    ProfilePatch: { type: object, additionalProperties: false }
    SettingsPatch: { type: object, additionalProperties: false }
  responses:
    Unauthorized: { description: JWT ausente, inválido ou expirado }
    ValidationError: { description: Corpo, query ou parâmetros inválidos }
    NotFound: { description: Recurso inexistente ou não pertencente ao usuário }
    ResultSetTooLarge: { description: Intervalo retorna mais de 10.000 lançamentos }
